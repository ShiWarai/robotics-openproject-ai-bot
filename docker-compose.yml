name: robotics-openproject-ai-bot

services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: openproject-bot-xray
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    networks:
      - default

  bot:
    build: .
    image: robotics-openproject-ai-bot:latest
    container_name: openproject-telegram-bot
    env_file: ${ENV_FILE:-.env}
    environment:
      HTTP_PROXY: http://xray:10808
      HTTPS_PROXY: http://xray:10808
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,rkllama,host.docker.internal,whisper-rknn-api}
      # Отдельный стек Whisper: имя сервиса в сети whisper_rknn_default. Переопределите в .env при другом хосте/порте.
      WHISPER_RKNN_URL: ${WHISPER_RKNN_URL:-http://whisper-rknn-api:9003}
    depends_on:
      xray:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./cache:/app/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - rkllama_default
      - whisper_rknn_default

networks:
  rkllama_default:
    external: true
  whisper_rknn_default:
    external: true
