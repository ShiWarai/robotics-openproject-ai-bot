name: robotics-openproject-ai-bot

services:
  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: openproject-bot-xray
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    networks:
      - default

  bot:
    build: .
    image: robotics-openproject-ai-bot:latest
    container_name: openproject-telegram-bot
    env_file: ${ENV_FILE:-.env}
    environment:
      HTTP_PROXY: http://xray:10808
      HTTPS_PROXY: http://xray:10808
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,rkllama,host.docker.internal}
    depends_on:
      xray:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cache:/app/cache
    networks:
      - default
      - rkllama_default

networks:
  rkllama_default:
    external: true
